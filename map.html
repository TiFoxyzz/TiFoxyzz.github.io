<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TiFoxyzz | Harita</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    .info {
      margin-top: 20px;
      font-size: 20px;
      opacity: 0.8;
    }
    .map-frame {
      width: 100%;
      height: calc(100vh - 160px);
      margin-top: 30px;
      border: none;
      background: #101010;
      border-top: 2px solid #ff7a00;
    }
  </style>
</head>
<body style="background:#000; margin:0;">
  <header style="padding:20px; font-size:28px; font-weight:bold; text-align:center; color:white;">TiFoxyzz Sunucu Haritası</header>

  <div class="map-switch" style="display:flex; justify-content:center; gap:20px; margin-top:10px;">
    <button onclick="showMap('overworld')" style="padding:14px 28px; font-size:20px; font-weight:bold; background:#ff7a00; border:none; border-radius:10px; cursor:pointer; color:white;">🌍 Overworld</button>
    <button onclick="showMap('nether')" style="padding:14px 28px; font-size:20px; font-weight:bold; background:#ff7a00; border:none; border-radius:10px; cursor:pointer; color:white;">🔥 Nether</button>
  </div>

  <iframe id="mapFrame" class="map-frame" src="https://dynmap-adresin-buraya.com" style="width:100%; height: calc(100vh - 180px); margin-top:20px; border:none;"></iframe>

<script>
function showMap(type){
  const f = document.getElementById("mapFrame");
  if(type === "overworld"){
    f.src = "overworld-map-url";
  } else {
    f.src = "nether-map-url";
  }
}
</script>

</body>
</html>
