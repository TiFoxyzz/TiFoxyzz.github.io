<div class="map-switch">
  <button onclick="showMap('overworld')">🌍 Overworld</button>
  <button onclick="showMap('nether')">🔥 Nether</button>
</div>

<iframe id="mapFrame" class="map-frame" src="overworld-map-url"></iframe>

<script>
function showMap(type){
  const f = document.getElementById("mapFrame");

  if(type === "overworld"){
    f.src = "overworld-map-url";   // buraya gerçek adres gelecek
  } else {
    f.src = "nether-map-url";      // buraya da nether adresi
  }
}
</script>
