<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TiFoxyzz | Harita</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    .info {
      margin-top: 20px;
      font-size: 20px;
      opacity: 0.8;
    }
    .map-frame {
      width: 100%;
      height: calc(100vh - 160px);
      margin-top: 30px;
      border: none;
      background: #101010;
      border-top: 2px solid #ff7a00;
    }
  </style>
</head>
<body>
  <header>TiFoxyzz Sunucu Haritası</header>
  <div class="info">🔶 Harita tamamen aktif! Aşağıdan görüntüleyebilirsin.</div>

  <!-- Eğer Dynmap adresin varsa aşağıdaki iframe içine yaz -->
  <iframe class="map-frame" src="https://dynmap-adresin-buraya.com"></iframe>

</body>
</html>
