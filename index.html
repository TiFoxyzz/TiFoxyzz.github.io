<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiFoxyzz Resmi Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #cc5c00; /* Daha koyu turuncu */
            margin: 0;
            padding: 0;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            font-size: 48px;
            font-weight: bold;
        }

        .button {
            display: block;
            width: 330px;              /* Tuş genişletildi */
            margin: 22px auto;
            padding: 25px;             /* Tuş daha büyük */
            background-color: #d9d9d9; /* Açık gri tuş */
            color: #cc5c00;            /* Turuncu yazı */
            font-size: 24px;           /* Daha büyük yazı */
            font-weight: bold;
            border-radius: 16px;       /* Daha oval görünüm */
            text-decoration: none;
            transition: 0.2s;
        }

        .button:hover {
            background-color: #ffffff;
        }

        .container {
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <h1>TiFoxyzz Minecraft Sunucusu</h1>

    <div class="container">

        <!-- Java Sürümü -->
        <a class="button" onclick="copyJava()">Java IP Kopyala<br>TiFoxyzz_LIVE.aternos.me</a>

        <!-- Bedrock Sürümü -->
        <a class="button" onclick="copyBedrock()">Bedrock IP Kopyala<br>TiFoxyzz_LIVE.aternos.me:15051</a>

        <!-- Harita butonu -->
        <a class="button" href="#" id="mapbtn">Harita (Yakında)</a>

        <!-- YouTube Bağlantısı -->
        <a class="button" href="https://www.youtube.com/@TiFoxyzz" target="_blank">
            YouTube Kanalım
        </a>

    </div>

    <script>
        function copyJava() {
            navigator.clipboard.writeText("TiFoxyzz_LIVE.aternos.me").then(() => {
                alert("Java IP kopyalandı!");
            });
        }

        function copyBedrock() {
            navigator.clipboard.writeText("TiFoxyzz_LIVE.aternos.me:15051").then(() => {
                alert("Bedrock IP kopyalandı!");
            });
        }
    </script>

</body>
</html>
