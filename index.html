<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TiFoxyzz Sunucusu</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
        color: white;
    }

    /* ARKA PLAN SLIDER */
    .slider {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-size: cover;
        background-position: center;
        animation: slide 18s infinite;
        filter: brightness(0.75);
    }

    @keyframes slide {
        0%   { background-image: url('/mnt/data/93e7e96e-fe3e-42f5-ac78-1dc4ab50e8ad.png'); }
        33%  { background-image: url('/mnt/data/6aaa3446-c5a3-456c-8f9d-a8cd756a4f6a.png'); }
        66%  { background-image: url('/mnt/data/Ekran Kaydı 2025-11-22 002328.mp4'); }
        100% { background-image: url('/mnt/data/93e7e96e-fe3e-42f5-ac78-1dc4ab50e8ad.png'); }
    }

    /* MENÜ */
    .topbar {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 20px;
        text-align: center;
        font-size: 22px;
        backdrop-filter: blur(10px);
    }
    .topbar a {
        color: white;
        margin: 0 20px;
        text-decoration: none;
        font-weight: bold;
    }

    /* ORTA YAZI */
    .center-box {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        animation: fadeIn 2s ease;
    }

    .title {
        font-size: 55px;
        font-weight: bold;
        text-shadow: 0 0 20px black;
    }

    .subtitle {
        margin-top: 15px;
        font-size: 26px;
        text-shadow: 0 0 20px black;
    }

    /* SAĞ PANEL */
    .right-panel {
        position: fixed;
        right: 20px; top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .panel-btn {
        padding: 15px 20px;
        background: rgba(0,0,0,0.5);
        border-radius: 10px;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
        backdrop-filter: blur(5px);
    }
    .panel-btn:hover {
        background: rgba(255,255,255,0.2);
    }
</style>

<script>
function copyIP() {
    navigator.clipboard.writeText("TiFoxyzz_LIVE.aternos.me");
    alert("IP kopyalandı!");
}
</script>
</head>

<body>

<div class="slider"></div>

<!-- Menü -->
<div class="topbar">
    <a href="#">Harita</a>
    <a href="#">Wiki</a>
</div>

<!-- Ortadaki Başlık -->
<div class="center-box">
    <div class="title">Tahta Yumruğunla Başla</div>
    <div class="subtitle">Ve Her Adımı Anılara Dönüştür</div>
</div>

<!-- Sağdaki Panel -->
<div class="right-panel">
    <div onclick="copyIP()" class="panel-btn">📋 IP'yi Kopyala</div>
    <a href="https://youtube.com" class="panel-btn">▶ YouTube</a>
    <a href="https://discord.com" class="panel-btn">💬 Discord</a>
</div>

</body>
</html>
