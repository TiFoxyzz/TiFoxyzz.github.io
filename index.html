<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiFoxyzz Network</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #0f0f0f;
            color: white;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #181818;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 0 20px #0005;
        }

        .navbar a {
            color: white;
            margin-left: 25px;
            text-decoration: none;
            font-size: 18px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #ff7a00;
        }

        /* HERO */
        .hero {
            width: 100%;
            height: 100vh;
            background: url('https://i.imgur.com/JrWwF2Q.jpeg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 80px;
        }

        .hero h1 {
            font-size: 55px;
            font-weight: 900;
            text-shadow: 0 0 15px #000;
        }

        .hero span {
            color: #ff7a00;
        }

        .hero p {
            font-size: 25px;
            text-shadow: 0 0 15px #000;
            margin-top: 10px;
        }

        /* Button */
        .btn {
            margin-top: 30px;
            padding: 18px 35px;
            background-color: #ff7a00;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px #000;
        }

        .btn:hover {
            background-color: #ff962f;
        }

        /* IP KUTUSU */
        .ip-box {
            background-color: #1c1c1c;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 20px;
            font-size: 22px;
            border: 2px dotted #ff7a00;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div style="font-size: 24px; font-weight: 700;">TiFoxyzz Network</div>

        <div>
            <a href="#">Anasayfa</a>
            <a href="#">Mağaza</a>
            <a href="#">Destek</a>
            <a href="#">Harita</a>
            <a href="#">Wiki</a>
        </div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <div>
            <h1>ZİRVELER <span>EN İYİLER</span> İÇİNDİR</h1>
            <p>SONSUZ MACERAYA HAZIRLAN!</p>

            <div class="ip-box">
                Java IP: **TiFoxyzz_LIVE.aternos.me**
            </div><br>

            <div class="ip-box">
                Bedrock IP: **TiFoxyzz_LIVE.aternos.me:15051**
            </div><br>

            <button class="btn">TIKLA VE IP ADRESİNİ KOPYALA</button>
        </div>
    </div>

</body>
</html>
