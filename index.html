<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TiFoxyzz | Tahta Yumruğu</title>
  <style>
    :root{
      --accent:#ff7a00;
      --bg-image: url('/mnt/data/A_digital_graphic_design_features_a_dark_grid-patt.png');
      --panel: rgba(0,0,0,0.52);
      --btn-bg: rgba(255,255,255,0.08);
      --btn-hover: rgba(255,255,255,0.12);
      --white: #ffffff;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;color:var(--white)}

    .bg{
      position:fixed;inset:0;background-image:var(--bg-image);background-size:cover;background-position:center;z-index:-2;
    }
    .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.55),rgba(0,0,0,0.65));z-index:-1}

    header{position:fixed;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .nav-left{font-weight:800;letter-spacing:-0.5px}
    nav a{color:rgba(255,255,255,0.9);text-decoration:none;margin-left:18px;font-weight:600}

    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
    .card{max-width:1100px;width:100%;padding:48px;border-radius:14px;background:var(--panel);backdrop-filter: blur(6px);display:flex;gap:32px;align-items:center}

    .hero{flex:1;text-align:center}
    .hero h1{font-size:72px;margin:0;line-height:0.95;font-weight:800;letter-spacing:-1px}
    .hero p{margin-top:16px;font-size:22px;color:rgba(255,255,255,0.92)}

    .side{width:320px;display:flex;flex-direction:column;gap:16px}
    .side .btn{background:var(--btn-bg);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--white);font-weight:700;display:flex;align-items:center;gap:12px;justify-content:flex-start;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
    .side .btn:hover{background:var(--btn-hover)}

    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:32px;background:rgba(0,0,0,0.7);color:white;padding:12px 18px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:all .25s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

    @media (max-width:980px){
      .card{flex-direction:column;padding:28px}
      .hero h1{font-size:44px}
      .side{width:100%}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <div class="nav-left">TiFoxyzz</div>
    <nav>
      <a href="/wiki">Wiki</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="card" role="region" aria-label="Tanıtım">

      <div class="hero">
        <h1>Tahta Yumruğunla Başla</h1>
        <p>Ve Her Adımı Anılara Dönüştür</p>
      </div>

      <aside class="side" aria-label="Hızlı erişim">
        <button class="btn" id="copyJavaBtn">📋 Java IP</button>
        <button class="btn" id="copyBedrockBtn">📋 Bedrock IP</button>
        <a class="btn" href="https://www.youtube.com/@TiFoxyzz" target="_blank">▶ YouTube</a>

        <!-- YENİ HARİTA BUTONU -->
        <a class="btn" href="https://tifoxyzz.github.io/map.html">📍 Harita</a>

      </aside>

    </section>
  </main>

  <div id="toast" class="toast">Kopyalandı!</div>

<script>
  const javaIP = 'TiFoxyzz_LIVE.aternos.me';
  const bedrockIP = 'TiFoxyzz_LIVE.aternos.me:15051';

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      showToast('IP panoya kopyalandı: ' + text);
    }catch(e){
      fallbackCopy(text);
    }
  }

  function fallbackCopy(txt){
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');showToast('IP panoya kopyalandı: ' + txt);}
    catch(e){alert('Kopyalama desteklenmiyor: ' + txt);}
    ta.remove();
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(()=> t.classList.remove('show'), 2500);
  }

  document.getElementById('copyJavaBtn').addEventListener('click', ()=> copyText(javaIP));
  document.getElementById('copyBedrockBtn').addEventListener('click', ()=> copyText(bedrockIP));
</script>

</body>
</html>
